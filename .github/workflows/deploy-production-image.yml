name: Deploy Production Image

# Builds the production image on GitHub-hosted runners and pushes it to GHCR,
# so the Dokploy host only has to PULL — never `next build` on the prod box.
# On-box builds were CPU-starving every service (load >300, healthchecks killed
# the app mid-deploy, exit 137). Public-repo ubuntu-latest runners are
# 4 vCPU / 16 GB which fits this tree's webpack build (OMNIROUTE_USE_TURBOPACK=0,
# same escape hatch as docker-publish.yml — hosted Turbopack OOMs).
#
# After the image is pushed, a Dokploy redeploy webhook fires when the repo
# secret DOKPLOY_DEPLOY_WEBHOOK_URL is set. The step is a no-op otherwise so
# the pipeline still works before the secret exists.

on:
  push:
    branches:
      - production
    paths-ignore:
      - ".github/workflows/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: prod-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE_NAME: ghcr.io/deptrai/omniroute

jobs:
  build-and-push:
    name: Build runner-web (amd64) and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert Docker Engine
        run: docker info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-web
          platforms: linux/amd64
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
          push: true
          tags: |
            ${{ env.GHCR_IMAGE_NAME }}:production
            ${{ env.GHCR_IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=prod-amd64
          cache-to: type=gha,scope=prod-amd64,mode=max,ignore-error=true
          no-cache: false
        env:
          DOCKER_BUILDKIT_INLINE_CACHE: 1

      - name: Trigger Dokploy redeploy (if webhook secret configured)
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK" ]; then
            echo "::notice::DOKPLOY_DEPLOY_WEBHOOK_URL not set — image pushed, redeploy manually or add the secret."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$DOKPLOY_WEBHOOK")
          echo "Dokploy webhook -> HTTP $code"
          [ "$code" -lt 400 ] || { echo "::error::Dokploy redeploy webhook failed ($code)"; exit 1; }
